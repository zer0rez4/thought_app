<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THOUGHTS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1 id="logo-name">
                <a href="./index.html">
                    THOUGHTS
                </a>
            </h1>
        </div>
        <div class="account">
            <button id="account-btn">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="12" cy="8" r="5" />
                    <path d="M20 21a8 8 0 0 0-16 0" />
                </svg>
            </button>
        </div>
    </header>
     <main>
        <div class="start-page">
            <button id="start-btn">
                Случайная мысль
            </button>
        </div>

        <div class="thought-page" hidden>
            <div class="thought-view">
                <p id="thought-text">
                    THOUGHT-TEXT 
                </p>
                <p id="author-name">
                    AUTHOR-NAME
                </p>
            </div>
            <div class="thought-actions">
                <button id="thought-btn">
                    Новая мысль
                </button>
            </div>
            <div class="other-btns">
                <button id="thought-search-btn">Поиск мыслей</button>
                <button id="thought-create-btn">Создать мысль</button>
            </div>
        </div>
    </main>

    <footer>

    </footer>

    <script src="js/main.js"></script>
</body>
</html>

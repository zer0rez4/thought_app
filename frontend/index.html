<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THOUGHTS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1 id="logo-name">
                <a href="./index.html">
                    THOUGHTS
                </a>
            </h1>
        </div>
        <div class="account">
            <button id="account-btn">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="12" cy="8" r="5" />
                    <path d="M20 21a8 8 0 0 0-16 0" />
                </svg>
            </button>
        </div>
    </header>
     <main>
        <div class="start-page">
            <button id="start-btn">
                Случайная мысль
            </button>
        </div>

        <div class="thought-page" hidden>
            <div class="thought-view">
                <p id="thought-text">
                    THOUGHT-TEXT 
                </p>
                <p id="author-name">
                    AUTHOR-NAME
                </p>
            </div>
            <div class="thought-actions">
                <button id="thought-btn">
                    Новая мысль
                </button>
            </div>
            <div class="other-btns">
                <button id="thought-search-btn">Поиск мыслей</button>
                <button id="thought-create-btn">Создать мысль</button>
            </div>
        </div>
    </main>

    <dialog id="auth-modal">
        <div class="register" hidden>
            <form id="register-form" novalidate>
                <h2>Регистрация</h2>

                <label for="register-username">Имя пользователя</label>
                <input type="text" id="register-username" autocomplete="username" required>
                <small class="field-error"></small>

                <label for="register-email">Электронная почта</label>
                <input type="email" id="register-email" autocomplete="email" required>
                <small class="field-error"></small>

                <label for="register-password">Пароль</label>
                <input type="password" id="register-password" autocomplete="new-password" required minlength="6">
                <small class="field-error"></small>

                <button type="button" class="change-auth-btn">
                    Уже есть аккаунт
                </button>

                <div class="dialog-actions">
                    <button type="submit" id="register-btn">Создать аккаунт</button>
                    <button type="button" class="close-btn">
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </form>
        </div>

        <div class="authorisation">
            <form id="auth-form" novalidate>
                <h2>Авторизация</h2>

                <label for="auth-email">Электронная почта</label>
                <input type="email" id="auth-email" autocomplete="email" required>
                <small class="field-error"></small>

                <label for="auth-password">Пароль</label>
                <input type="password" id="auth-password" autocomplete="current-password" required>
                <small class="field-error"></small>

                <button type="button" class="change-auth-btn">
                    Еще нет аккаунта
                </button>

                <div class="dialog-actions">
                    <button type="submit" id="auth-btn">Войти</button>
                    <button type="button" class="close-btn">
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </dialog>

    <footer>

    </footer>

    <script src="js/main.js"></script>
</body>
</html>
